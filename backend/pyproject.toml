[project]
name = "novel-backend"
version = "2.1.0"
description = "小说阅读平台后端 - C/B 端 RESTful API（FastAPI + SQLAlchemy 2.0 异步）"
requires-python = ">=3.11"
authors = [{ name = "Novel Backend Team" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.2",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.9",
    "redis>=5.0.7",
    "pyjwt>=2.9.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "structlog>=24.2.0",
    "orjson>=3.10.6",
    "python-multipart>=0.0.9",
    "bleach>=6.1.0",
    "cryptography>=42.0.8",
    "python-dotenv>=1.0.1",
    "pypinyin>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
    "ruff>=0.5.0",
    "hypothesis>=6.100.0",
    "pytest-benchmark>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = [
    "E501",   # line too long（由 formatter 处理）
    "B008",   # FastAPI 习惯在默认值调用函数
    "RUF001", # ambiguous-unicode-character-string（中文警告）
    "RUF002", # ambiguous-unicode-character-docstring（中文警告）
    "RUF003", # ambiguous-unicode-character-comment（中文警告）
    "RUF012", # mutable-class-default（Pydantic 模型安全处理可变默认值）
    "N815",   # mixed-case-variable-in-class-scope（ORM/Schema 字段对齐前端 camelCase）
    "N802",   # invalid-function-name（API 函数对齐前端方法名）
    "N803",   # invalid-argument-name（参数对齐前端字段名）
    "UP042",  # replace-str-enum（保持 str+Enum 兼容）
    "UP046",  # non-pep695-generic-class（兼容旧版语法）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"alembic/versions/*" = ["UP035", "UP007", "I001", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -n auto --benchmark-disable"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as performance benchmarks",
]
