<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.12"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
    <!-- 书脊渐变 -->
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- 左页渐变 -->
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <!-- 右页渐变 -->
    <linearGradient id="pageRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>
    <!-- 蓝点装饰渐变 -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角白色背景 -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>

  <!-- 左上装饰蓝点 -->
  <circle cx="100" cy="100" r="160" fill="url(#dotGlow)"/>

  <!-- 书籍主体（居中偏左，留出右侧文字空间） -->
  <g filter="url(#shadow)">
    <!-- 书脊 -->
    <rect x="108" y="130" width="28" height="260" rx="5" fill="url(#spine)"/>

    <!-- 左页 -->
    <rect x="136" y="134" width="96" height="252" rx="4" fill="url(#pageLeft)" stroke="#dbe5f5" stroke-width="0.8"/>

    <!-- 左页文字线条 -->
    <rect x="152" y="162" width="64" height="5" rx="2.5" fill="#3b82f6" opacity="0.3"/>
    <rect x="152" y="182" width="64" height="5" rx="2.5" fill="#3b82f6" opacity="0.2"/>
    <rect x="152" y="202" width="48" height="5" rx="2.5" fill="#3b82f6" opacity="0.15"/>

    <!-- 右页 -->
    <rect x="236" y="134" width="96" height="252" rx="4" fill="url(#pageRight)" stroke="#dbe5f5" stroke-width="0.8"/>

    <!-- 右页文字线条 -->
    <rect x="254" y="162" width="64" height="5" rx="2.5" fill="#3b82f6" opacity="0.25"/>
    <rect x="254" y="182" width="64" height="5" rx="2.5" fill="#3b82f6" opacity="0.15"/>
    <rect x="254" y="202" width="48" height="5" rx="2.5" fill="#3b82f6" opacity="0.1"/>

    <!-- 书签丝带 -->
    <path d="M196 130 L196 100 L210 112 L224 100 L224 130" fill="#3b82f6" opacity="0.9"/>
    <path d="M196 130 L196 100 L200 104 L200 116" fill="#2563eb" opacity="0.4"/>
  </g>

  <!-- 云字（右侧，更精致） -->
  <g filter="url(#textShadow)">
    <text
      x="392" y="310"
      text-anchor="middle"
      font-size="100"
      font-weight="700"
      font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','STKaiti','KaiTi',sans-serif"
      fill="#1a202c"
      letter-spacing="-0.02em"
    >云</text>

    <!-- 云字下方英文副标题 -->
    <text
      x="392" y="350"
      text-anchor="middle"
      font-size="14"
      font-weight="500"
      font-family="'Inter','system-ui',sans-serif"
      fill="#3b82f6"
      letter-spacing="0.15em"
    >NOVEL</text>
  </g>

  <!-- 底部装饰线 -->
  <rect x="300" y="370" width="184" height="2" rx="1" fill="#3b82f6" opacity="0.15"/>
</svg>