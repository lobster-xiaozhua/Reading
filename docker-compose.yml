# ============================================================
# docker compose — Atlas 小说阅读平台
#   前端 (nginx):  80 = C 端, 8080 = B 端
#   后端 (fastapi): 8000 (仅容器内)
#   数据库: SQLite 持久化卷
# 用法:
#   docker compose up -d --build
#   docker compose logs -f backend
#   docker compose down
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-false}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      - DB_URL=sqlite+aiosqlite:////data/novel.db
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - atlas-data:/data
      - atlas-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "8080:8080"

volumes:
  atlas-data:
  atlas-uploads: