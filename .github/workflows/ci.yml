name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint · Typecheck · Token Scan · Import Audit · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @novel/tokens run build

      - name: Build icons
        run: pnpm --filter @novel/icons run build

      - name: Build components
        run: pnpm --filter @novel/components run build

      - name: Build shared types
        run: pnpm --filter @novel/types run build

      - name: Build token-scanner
        run: pnpm --filter @novel/tools-token-scanner run build

      - name: Build b-end package
        run: pnpm --filter @novel/b-end run build

      - name: Build C-end app
        run: pnpm --filter @novel/web run build

      - name: Build B-end app
        run: pnpm --filter @novel/admin run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Token scan
        run: pnpm run token-scan -- --root .

      - name: Import audit
        run: node tools/token-scanner/dist/import-audit.js --root apps/admin

      - name: Test
        run: pnpm run test

  backend:
    name: Backend Lint · Import · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Import check
        run: python -c "import app.main"

      - name: Pytest with coverage (threshold 70%)
        run: python -m pytest tests/ -v --tb=short --cov=app/ --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  monitoring:
    name: Playwright Monitoring
    runs-on: ubuntu-latest
    needs: [quality, backend]
    services:
      backend:
        image: python:3.12-slim
        ports:
          - 8000:8000
        options: >-
          --health-cmd "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          cd backend && pip install -e ".[dev]" && uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          cd apps/admin && pnpm dev &
          sleep 5
          cd apps/web && pnpm dev &
          sleep 5
          bash monitoring/run.sh --only health
        timeout-minutes: 5

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: pip audit
        working-directory: backend
        run: pip-audit || true


