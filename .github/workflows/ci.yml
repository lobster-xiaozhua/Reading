name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint · Typecheck · Token Scan · Import Audit · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @novel/tokens run build

      - name: Build icons
        run: pnpm --filter @novel/icons run build

      - name: Build components
        run: pnpm --filter @novel/components run build

      - name: Build shared types
        run: pnpm --filter @novel/types run build

      - name: Build token-scanner
        run: pnpm --filter @novel/tools-token-scanner run build

      - name: Build b-end package
        run: pnpm --filter @novel/b-end run build

      - name: Build C-end app
        run: pnpm --filter @novel/web run build

      - name: Build B-end app
        run: pnpm --filter @novel/admin run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Token scan (advisory)
        run: pnpm run token-scan -- --root . || true

      - name: Import audit
        run: node tools/token-scanner/dist/import-audit.js --root apps/admin

      - name: Test
        run: pnpm run test

      - name: Frontend coverage (web)
        run: pnpm --filter @novel/web exec vitest run --coverage

      - name: Frontend coverage (admin)
        run: pnpm --filter @novel/admin exec vitest run --coverage

  backend:
    name: Backend Lint · Import · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Import check
        run: python -c "import app.main"

      - name: Pytest with coverage (threshold 70%)
        run: python -m pytest tests/ -v --tb=short --cov=app/ --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  monitoring:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: [quality, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start backend & check health
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -sf http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok', f'unexpected: {d}'; print('Backend health check passed')"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip audit
        working-directory: backend
        run: pip-audit --strict


